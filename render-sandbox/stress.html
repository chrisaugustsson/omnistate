<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>omni-render stress file</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #cbd5e1;
        color: #0f172a;
        font: 13px/1.5 system-ui, sans-serif;
      }

      /* main-stress.js sizes the drawing buffer to this canvas. touch-action
         keeps the browser from scrolling or zooming the page itself. */
      #canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #canvas.panning {
        cursor: grab;
      }

      #canvas.grabbing {
        cursor: grabbing;
      }

      /* Hover and selection outlines, drawn by main-stress.js from the module's
         overlay, in the same pixels as the canvas under it. */
      #overlay {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      #overlay .outline {
        position: absolute;
        box-sizing: border-box;
        border: 1.5px solid #3b82f6;
      }

      #overlay .outline.selection {
        border-color: #2563eb;
        border-width: 2px;
      }

      #overlay .label {
        position: absolute;
        left: -2px;
        bottom: 100%;
        max-width: 240px;
        padding: 1px 6px;
        overflow: hidden;
        border-radius: 3px 3px 0 0;
        background: #3b82f6;
        color: #fff;
        font-size: 11px;
        line-height: 16px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #overlay .outline.selection .label {
        background: #2563eb;
      }

      #overlay .outline.inside .label {
        bottom: auto;
        top: 0;
        border-radius: 0 0 3px 0;
      }

      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        max-width: 420px;
        padding: 8px 12px;
        border-radius: 6px;
        background: rgb(255 255 255 / 0.9);
        box-shadow: 0 1px 3px rgb(15 23 42 / 0.25);
        pointer-events: none;
      }

      #hud strong {
        font-size: 14px;
      }

      #hud p {
        margin: 0;
      }

      #status {
        color: #475569;
        font-variant-numeric: tabular-nums;
      }

      code {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="overlay"></div>
    <div id="hud">
      <p><strong>omni-render stress file</strong></p>
      <p>
        Zoom: pinch, or <code>Ctrl</code>/<code>Cmd</code> + wheel. Pan: scroll, or drag while holding
        <code>Space</code>.
      </p>
      <p>
        Select: click a node of the board, double-click to go into it, <code>Esc</code> to go back out,
        <code>Ctrl</code>/<code>Cmd</code> + click for the deepest node.
      </p>
      <p id="selection">Nothing selected.</p>
      <p id="status">Loading the renderer…</p>
    </div>
    <script type="module" src="./main-stress.js"></script>
  </body>
</html>
