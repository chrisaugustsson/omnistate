# The whole system on one address: `docker compose up` starts Postgres, RustFS,
# the API, the web app and the reverse proxy. The other services are reachable
# inside the Compose network only. The credentials below are development
# defaults for this local stack; override them in .env.
#
# The address is http://omnistate.localhost: the proxy joins the shared `edge`
# network, where the machine's Traefik (docker/edge/, started once with
# `make edge`) routes that hostname to it, so nothing here needs a port number
# that another project might also publish. The hostname follows the Compose project name, so a second stack
# (`docker compose -p omnistate-x up`) is http://omnistate-x.localhost. Without
# the edge, the proxy is still published on a port of its own (OMNI_PORT,
# default 8420) at http://localhost:8420.
name: omnistate

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: omni
      POSTGRES_PASSWORD: ${OMNI_POSTGRES_PASSWORD:-omni-dev}
      POSTGRES_DB: omni
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni -d omni"]
      interval: 2s
      timeout: 3s
      retries: 30

  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${OMNI_S3_ACCESS_KEY:-omni-dev}
      RUSTFS_SECRET_KEY: ${OMNI_S3_SECRET_KEY:-omni-dev-secret}
    volumes:
      - rustfs-data:/data

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      # The API runs as omni_api, which owns no table and cannot bypass
      # row-level security. Start-up applies the migrations as the owner and
      # gives omni_api this password.
      OMNI_DATABASE_URL: postgres://omni_api:${OMNI_API_DB_PASSWORD:-omni-api-dev}@postgres:5432/omni
      OMNI_API_DB_PASSWORD: ${OMNI_API_DB_PASSWORD:-omni-api-dev}
      OMNI_ADMIN_DATABASE_URL: postgres://omni:${OMNI_POSTGRES_PASSWORD:-omni-dev}@postgres:5432/omni
      OMNI_S3_ENDPOINT: http://rustfs:9000
      OMNI_S3_ACCESS_KEY: ${OMNI_S3_ACCESS_KEY:-omni-dev}
      OMNI_S3_SECRET_KEY: ${OMNI_S3_SECRET_KEY:-omni-dev-secret}
      OMNI_S3_BUCKET: omni
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  proxy:
    image: caddy:2-alpine
    # The fallback address for a machine without the edge; the edge reaches
    # the proxy over the `edge` network, not through this port.
    ports:
      - "${OMNI_PORT:-8420}:80"
    networks: [default, edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-omnistate}.rule=Host(`${COMPOSE_PROJECT_NAME:-omnistate}.localhost`)
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-omnistate}.loadbalancer.server.port=80
      - traefik.docker.network=edge
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_healthy
    # Healthy once the web app and the API (which checks Postgres and the
    # RustFS bucket) both answer through the proxy.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health && wget -q -O /dev/null http://127.0.0.1/api/health"]
      interval: 2s
      timeout: 3s
      retries: 60

  # The integration tests (`make test` runs it with `docker compose run`).
  test:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/test.Dockerfile
    environment:
      OMNI_STACK_URL: http://proxy
      # Linking several test binaries at once runs the Docker VM out of
      # memory (ld killed with signal 9), so link one at a time.
      CARGO_BUILD_JOBS: "1"
    volumes:
      - .:/workspace
      - test-target:/cargo-target
      - test-cargo-registry:/usr/local/cargo/registry
    depends_on:
      proxy:
        condition: service_healthy

volumes:
  postgres-data:
  rustfs-data:
  test-target:
  test-cargo-registry:

networks:
  # The machine-wide network the edge routes through (`make edge` creates it);
  # when the edge is not running, Compose creates it here instead and the
  # labels above stay inert.
  edge:
    name: edge
