[package]
name = "omni-api"
version.workspace = true
edition.workspace = true
publish.workspace = true
# The pinned toolchain (rust-toolchain.toml), so the resolver picks dependency
# versions that build with it.
rust-version = "1.88"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
# The Compose network is trusted, so the connections use no TLS. migrate! embeds
# the SQL files of migrations/ in the binary.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
rust-s3 = { version = "0.37", default-features = false, features = ["tokio-rustls-tls"] }
serde_json = "1"
argon2 = "0.5"
sha2 = "0.10"
utoipa = "5"
serde = { version = "1", features = ["derive"] }

[features]
# The setup, key and stack tests (tests/setup_login.rs, tests/api_keys.rs,
# tests/stack_auth.rs) talk to
# Postgres and the running Compose stack, so they only build with this feature,
# which the Compose test container turns on.
stack-tests = []

[[test]]
name = "setup_login"
required-features = ["stack-tests"]

[[test]]
name = "stack_auth"
required-features = ["stack-tests"]

[[test]]
name = "api_keys"
required-features = ["stack-tests"]
