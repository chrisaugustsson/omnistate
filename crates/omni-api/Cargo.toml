[package]
name = "omni-api"
version.workspace = true
edition.workspace = true
publish.workspace = true
# The pinned toolchain (rust-toolchain.toml), so the resolver picks dependency
# versions that build with it.
rust-version = "1.88"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
# The Compose network is trusted, so the connections use no TLS.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
rust-s3 = { version = "0.37", default-features = false, features = ["tokio-rustls-tls"] }
serde_json = "1"
