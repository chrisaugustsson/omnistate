[package]
name = "omni-api"
version.workspace = true
edition.workspace = true
publish.workspace = true
# The pinned toolchain (rust-toolchain.toml), so the resolver picks dependency
# versions that build with it.
rust-version = "1.88"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
# The Compose network is trusted, so the connections use no TLS. migrate! embeds
# the SQL files of migrations/ in the binary.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
rust-s3 = { version = "0.37", default-features = false, features = ["tokio-rustls-tls"] }
serde_json = "1"
argon2 = "0.5"
sha2 = "0.10"
subtle = "2"
utoipa = "5"
serde = { version = "1", features = ["derive"] }
omni-core = { path = "../omni-core" }

[dev-dependencies]
# tests/boards.rs checks that a chunk is named by the BLAKE3 hash of its bytes.
blake3 = "1"

[features]
# The setup, key, deletion, change set, doc, claim, version, approval, rebase
# and stack tests (tests/setup_login.rs, tests/api_keys.rs,
# tests/workspace_delete.rs, tests/changesets.rs, tests/live_events.rs,
# tests/isolation.rs, tests/attachments.rs, tests/docs.rs, tests/claims.rs,
# tests/versions.rs, tests/approve_merge.rs, tests/rebase.rs, tests/tokens.rs,
# tests/boards.rs, tests/design_edits.rs, tests/threads.rs, tests/posts.rs,
# tests/sealed_phases.rs, tests/thread_waits.rs, tests/decisions.rs,
# tests/comments.rs, tests/project_home.rs, tests/doc_versions.rs,
# tests/stack_auth.rs) talk to Postgres and the running Compose stack, so they
# only build with this feature, which the Compose test container turns on.
stack-tests = []

[[test]]
name = "setup_login"
required-features = ["stack-tests"]

[[test]]
name = "stack_auth"
required-features = ["stack-tests"]

[[test]]
name = "api_keys"
required-features = ["stack-tests"]

[[test]]
name = "workspace_delete"
required-features = ["stack-tests"]

[[test]]
name = "changesets"
required-features = ["stack-tests"]

[[test]]
name = "live_events"
required-features = ["stack-tests"]

[[test]]
name = "isolation"
required-features = ["stack-tests"]

[[test]]
name = "attachments"
required-features = ["stack-tests"]

[[test]]
name = "docs"
required-features = ["stack-tests"]

[[test]]
name = "claims"
required-features = ["stack-tests"]

[[test]]
name = "versions"
required-features = ["stack-tests"]

[[test]]
name = "approve_merge"
required-features = ["stack-tests"]

[[test]]
name = "rebase"
