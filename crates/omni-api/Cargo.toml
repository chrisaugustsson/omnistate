[package]
name = "omni-api"
version.workspace = true
edition.workspace = true
publish.workspace = true
# The pinned toolchain (rust-toolchain.toml), so the resolver picks dependency
# versions that build with it.
rust-version = "1.88"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
# The Compose network is trusted, so the connections use no TLS. migrate! embeds
# the SQL files of migrations/ in the binary.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
rust-s3 = { version = "0.37", default-features = false, features = ["tokio-rustls-tls"] }
serde_json = "1"
# The previews of a design's boards go to the viewer as Base64 in JSON.
base64 = "0.22"
argon2 = "0.5"
sha2 = "0.10"
subtle = "2"
utoipa = "5"
serde = { version = "1", features = ["derive"] }
omni-core = { path = "../omni-core" }
# Lays out the boards of a design outline, so that each placeholder has the
# box of its content (src/placeholders.rs).
omni-render = { path = "../omni-render" }

[dev-dependencies]
# tests/boards.rs checks that a chunk is named by the BLAKE3 hash of its bytes.
blake3 = "1"

[features]
# The tests that talk to Postgres and the running Compose stack only build with
# this feature, which the Compose test container turns on.
stack-tests = []

[[test]]
name = "setup_login"
required-features = ["stack-tests"]

