[package]
name = "omni-penpot"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
omni-core = { path = "../omni-core" }
# The comparison draws the converted boards with the renderer, and reads and
# writes PNGs with the codec it links: the version and features omni-render pins.
omni-render = { path = "../omni-render" }
skia-safe = { version = "0.153.3", features = ["gl", "textlayout"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

