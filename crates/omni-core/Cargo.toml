[package]
name = "omni-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# The renderer, the API and the CLI read designs with serde_json. Its
# float_roundtrip feature reads each number back as the exact double it was
# written from, so designs round-trip without loss. Cargo unifies features, so
# declaring it here turns it on in every build that links omni-core.
serde_json = { version = "1", features = ["float_roundtrip"] }

[features]
# The stack tests (tests/stack.rs) talk to the running Docker Compose stack, so
# they only build with this feature, which the Compose test container turns on.
stack-tests = []

[[test]]
name = "stack"
required-features = ["stack-tests"]
