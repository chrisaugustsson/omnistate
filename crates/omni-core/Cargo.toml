[package]
name = "omni-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# HTML docs are free-form HTML (US-109): html5ever reads them the way a browser
# does, so what the engine edits is what the viewer frame shows.
html5ever = "0.27"
markup5ever_rcdom = "0.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
# The renderer, the API and the CLI read designs with serde_json. Its
# float_roundtrip feature reads each number back as the exact double it was
# written from, so designs round-trip without loss. Cargo unifies features, so
# declaring it here turns it on in every build that links omni-core.
serde_json = { version = "1", features = ["float_roundtrip"] }

[features]
# The stack tests (tests/stack.rs) talk to the running Docker Compose stack, so
# they only build with this feature, which the Compose test container turns on.
stack-tests = []

[[test]]
name = "stack"
required-features = ["stack-tests"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The tenancy tests (tests/tenancy.rs) talk to Postgres and apply migrations/
# the way the API does. They never build for WebAssembly, which sqlx and tokio's
# networking do not support.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate"] }
tokio = { version = "1", features = ["rt", "net", "time"] }

[[test]]
name = "tenancy"
required-features = ["stack-tests"]

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# The engine tests (tests/ops.rs) run in WebAssembly too, with
# `wasm-pack test --node`.
wasm-bindgen-test = "0.3"
