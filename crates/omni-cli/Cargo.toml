[package]
name = "omni-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "omni"
path = "src/main.rs"

[dependencies]
# `omni import penpot` reads a Penpot export with the crate that converts them
# (US-051). Without its comparison, which links the renderer, it pulls in only
# the reader, the converter and OmniState's design model.
omni-penpot = { path = "../omni-penpot", default-features = false }
# `omni tokens set` and `remove` change one token of the tree and check the
# result with the tree's own reader before sending it.
omni-core = { path = "../omni-core" }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
rustls-pki-types = "1.15.1"

[dev-dependencies]
# The stack tests (tests/stack.rs) serve the API's router against a scratch
# database, as the omni-api tests do, and run the built `omni` against it.
omni-api = { path = "../omni-api" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
# The HTTPS tests (tests/cli.rs) make a certificate authority and a server
# certificate for each run, so no key is kept in the repository.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[features]
# tests/stack.rs, tests/stack_attachments.rs, tests/stack_docs.rs,
# tests/stack_bench_ops.rs, tests/stack_design_edits.rs,
# tests/stack_bench_design.rs, tests/stack_import_penpot.rs, tests/stack_threads.rs,
# tests/stack_comments.rs, tests/stack_features.rs and tests/stack_stories.rs
# need Postgres (and RustFS) and run against them, so they only build with this
# feature, which the Compose test container turns on.
stack-tests = []

[[test]]
name = "stack"
required-features = ["stack-tests"]

[[test]]
name = "stack_attachments"
required-features = ["stack-tests"]

[[test]]
name = "stack_docs"
required-features = ["stack-tests"]

[[test]]
name = "stack_bench_ops"
required-features = ["stack-tests"]

[[test]]
name = "stack_design_edits"
required-features = ["stack-tests"]

[[test]]
name = "stack_bench_design"
required-features = ["stack-tests"]

[[test]]
name = "stack_import_penpot"
required-features = ["stack-tests"]

[[test]]
name = "stack_threads"
required-features = ["stack-tests"]

[[test]]
name = "stack_comments"
required-features = ["stack-tests"]

[[test]]
name = "stack_features"
required-features = ["stack-tests"]

[[test]]
name = "stack_stories"
required-features = ["stack-tests"]
