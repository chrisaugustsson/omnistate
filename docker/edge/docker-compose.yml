# The edge: the one thing on this Mac that owns port 80, so every local
# project is reached by name (http://<project>.localhost) instead of by a
# port number that collides with the next project. Traefik watches Docker
# and routes by hostname; a project opts in by joining the `edge` network
# and labelling the service that should answer (README.md shows how; this
# repo's docker-compose.yml is an example).
#
# Start it once with `make edge` and leave it running; it comes back with
# Docker Desktop. It is a Compose project of its own, named `edge`, shared
# by every project on the machine: another repo may carry an identical copy
# of this file, and whichever starts first owns port 80.
#
# `*.localhost` names need no /etc/hosts entry: macOS, Chrome, Firefox and
# curl all resolve them to loopback, and browsers treat them as a secure
# context, so cookies marked Secure work over plain http.
#
# Port 80 is published on the loopback addresses only (IPv4 and IPv6, since
# macOS resolves *.localhost to both), so nothing is exposed on the LAN.
name: edge

services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=edge
      - --entryPoints.web.address=:80
      - --api.dashboard=true
      - --log.level=INFO
    ports:
      - "127.0.0.1:80:80"
      - "[::1]:80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [edge]
    labels:
      # The dashboard lists every hostname the edge currently routes.
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.localhost`)
      - traefik.http.routers.traefik.service=api@internal

networks:
  # Shared with every project that joins it. The edge normally creates it;
  # a project that starts first creates it too (same name, same network),
  # and Docker keeps it as long as anything is attached.
  edge:
    name: edge
